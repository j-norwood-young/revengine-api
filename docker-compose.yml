services:
  api:
    image: jasony/revengine-api
    build:
      context: ..
      dockerfile: revengine-api/Dockerfile
      no_cache: true
    restart: always
    stdin_open: true
    tty: true
    ports:
      - 4001:4001
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4001
    extra_hosts:
      - "rfvengine1:10.0.1.3"
      - "rfvengine2:10.0.1.4"
      - "rfvengine3:10.0.1.5"
      - "rfvengine4:10.0.1.6"
    volumes:
      - .:/usr/src/app
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 60s
        order: start-first
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4001/api/test | grep -q '\"count\".*\"data\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
